<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>珠光 1 栋 3F · 315 / 303 / 301 三维空间演示</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e0a46a'/%3E%3C/svg%3E" />
<style>
:root {
  --ink: #101318;
  --ink-2: #171b21;
  --line: rgba(255, 255, 255, .10);
  --line-2: rgba(255, 255, 255, .06);
  --txt: #f4f3f0;
  --txt-2: rgba(244, 243, 240, .58);
  --txt-3: rgba(244, 243, 240, .38);
  --accent: #e0a46a;
  --accent-2: #f0c39a;
  --ok: #6fe0a8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #cfd9e2;
  font-family: -apple-system, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--txt);
  -webkit-font-smoothing: antialiased;
}

#stage { position: relative; width: 100%; height: 100%; }
#scene { display: block; width: 100%; height: 100%; outline: none; }

/* ---------------- 品牌 ---------------- */
.brand {
  position: absolute; top: 22px; left: 24px;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 18px 12px 14px;
  background: rgba(13, 16, 20, .72);
  border: 1px solid var(--line);
  border-radius: 14px;
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  pointer-events: none;
  animation: fadeDown .7s cubic-bezier(.2,.8,.2,1) both;
}
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px; flex: 0 0 auto;
  background: linear-gradient(150deg, var(--accent-2), var(--accent) 55%, #9c6a3c);
  box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset;
}
.brand-txt h1 { font-size: 13px; font-weight: 600; letter-spacing: .04em; }
.brand-txt p { font-size: 10.5px; color: var(--txt-2); letter-spacing: .06em; margin-top: 3px; }
.rev {
  font-size: 9.5px; letter-spacing: .14em; color: var(--accent);
  border: 1px solid rgba(224,164,106,.35); border-radius: 5px;
  padding: 2px 6px; margin-left: 6px;
}

/* ---------------- 面板 ---------------- */
.panel {
  position: absolute; top: 22px; right: 22px; width: 252px;
  background: rgba(13, 16, 20, .76);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 6px 16px 14px;
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  box-shadow: 0 18px 50px rgba(6, 10, 16, .35);
  max-height: calc(100vh - 44px);
  overflow-y: auto;
  animation: fadeLeft .7s .1s cubic-bezier(.2,.8,.2,1) both;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.16) transparent;
  transition: transform .38s cubic-bezier(.4,0,.2,1), opacity .3s;
}
.panel::-webkit-scrollbar { width: 4px; }
.panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 3px; }

.panel section { border-top: 1px solid var(--line-2); padding: 13px 0 4px; }
.panel section:first-of-type { border-top: none; padding-top: 14px; }

.panel h2 {
  font-size: 9.5px; font-weight: 500; letter-spacing: .18em;
  color: var(--txt-3); text-transform: uppercase; margin-bottom: 11px;
  display: flex; align-items: baseline; justify-content: space-between;
}
.panel h2 em { font-style: normal; font-size: 9px; letter-spacing: .04em; color: rgba(255,255,255,.26); }

.views { display: flex; flex-wrap: wrap; gap: 6px; }
.vbtn {
  flex: 1 1 calc(33.333% - 6px);
  padding: 7px 4px; font-size: 11px; font-family: inherit; color: var(--txt-2);
  background: rgba(255,255,255,.045); border: 1px solid transparent;
  border-radius: 8px; cursor: pointer; transition: all .18s;
}
.vbtn:hover { background: rgba(255,255,255,.09); color: var(--txt); }
.vbtn.on { background: rgba(224,164,106,.16); border-color: rgba(224,164,106,.42); color: var(--accent-2); }

.switches { display: flex; flex-direction: column; gap: 2px; }
.sw {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px; color: var(--txt-2); padding: 6px 0; cursor: pointer;
  transition: color .18s;
}
.sw:hover { color: var(--txt); }
.sw input { display: none; }
.sw i {
  width: 32px; height: 18px; border-radius: 10px; position: relative;
  background: rgba(255,255,255,.11); transition: background .22s;
  flex: 0 0 auto;
}
.sw i::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 12px; height: 12px; border-radius: 50%; background: #dedcd7;
  transition: transform .22s cubic-bezier(.4,1.4,.5,1), background .22s;
}
.sw input:checked + i { background: rgba(224,164,106,.55); }
.sw input:checked + i::after { transform: translateX(14px); background: #fff5ea; }

/* 门 */
.doors { display: flex; flex-direction: column; gap: 1px; }
.drow {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.045);
  font-size: 11px; color: var(--txt-2);
}
.drow:last-child { border-bottom: none; }
.dcode {
  font-size: 9px; letter-spacing: .06em; color: var(--txt-3);
  min-width: 26px; font-variant-numeric: tabular-nums;
}
.dname { flex: 1; line-height: 1.35; }
.dbtn {
  border: 1px solid rgba(255,255,255,.13); background: rgba(255,255,255,.04);
  color: var(--txt-2); font-family: inherit; font-size: 10px;
  padding: 4px 9px; border-radius: 6px; cursor: pointer; transition: all .18s;
  min-width: 40px; flex: 0 0 auto;
}
.dbtn:hover { background: rgba(255,255,255,.1); color: var(--txt); }
.dbtn.on { background: rgba(111,224,168,.14); border-color: rgba(111,224,168,.4); color: var(--ok); }

.door-actions { display: flex; gap: 6px; margin-top: 10px; }
.door-actions button {
  flex: 1; padding: 6px; font-family: inherit; font-size: 10.5px;
  background: rgba(255,255,255,.05); border: 1px solid var(--line);
  color: var(--txt-2); border-radius: 7px; cursor: pointer; transition: all .18s;
}
.door-actions button:hover { background: rgba(255,255,255,.1); color: var(--txt); }

.restore { padding-bottom: 2px !important; }
#restore {
  width: 100%; padding: 7px; font-family: inherit; font-size: 10.5px;
  background: none; border: 1px dashed rgba(255,255,255,.16);
  color: var(--txt-3); border-radius: 7px; cursor: pointer; transition: all .18s;
}
#restore:hover { color: var(--accent); border-color: rgba(224,164,106,.4); }

.panel-tab { display: none; }

/* ---------------- 提示 ---------------- */
.hint {
  position: absolute; left: 24px; bottom: 20px;
  display: flex; gap: 16px; align-items: center;
  font-size: 10px; letter-spacing: .05em; color: rgba(255,255,255,.72);
  background: rgba(13, 16, 20, .55);
  border: 1px solid var(--line);
  padding: 9px 14px; border-radius: 10px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  animation: fadeUp .8s .5s cubic-bezier(.2,.8,.2,1) both;
  pointer-events: none;
}
.hint span { display: flex; align-items: center; gap: 6px; }
.hint span::before {
  content: ''; width: 3px; height: 3px; border-radius: 50%;
  background: var(--accent); opacity: .8;
}

/* ---------------- 标签 ---------------- */
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl {
  position: absolute; transform: translate(-50%, -50%);
  text-align: left; white-space: nowrap;
  transition: opacity .3s;
  will-change: transform, opacity;
}
.lbl .t {
  font-size: 11.5px; font-weight: 500; letter-spacing: .04em; color: #fff;
  text-shadow: 0 1px 6px rgba(0,0,0,.55);
}
.lbl .s {
  font-size: 9.5px; color: rgba(255,255,255,.62); margin-top: 2px;
  letter-spacing: .05em; text-shadow: 0 1px 5px rgba(0,0,0,.6);
}
.lbl .dot {
  position: absolute; left: -12px; top: 5px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px rgba(224,164,106,.22);
}

/* ---------------- toast ---------------- */
.toast {
  position: absolute; left: 50%; bottom: 76px; transform: translate(-50%, 10px);
  background: rgba(13,16,20,.9); border: 1px solid var(--line);
  color: var(--txt); font-size: 11px; letter-spacing: .03em;
  padding: 8px 16px; border-radius: 9px;
  opacity: 0; pointer-events: none; transition: all .3s cubic-bezier(.2,.8,.2,1);
  backdrop-filter: blur(14px);
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------------- loader ---------------- */
.loader {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: #0f1216; z-index: 20;
  transition: opacity .7s ease, visibility .7s;
}
.loader.hide { opacity: 0; visibility: hidden; }
.loader-inner { text-align: center; }
.ring {
  width: 34px; height: 34px; margin: 0 auto 14px;
  border: 1.5px solid rgba(255,255,255,.12);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 1s linear infinite;
}
.loader p { font-size: 10.5px; letter-spacing: .22em; color: var(--txt-3); text-transform: uppercase; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
@keyframes fadeLeft { from { opacity: 0; transform: translateX(14px); } }

/* ---------------- 移动端 ---------------- */
@media (max-width: 820px) {
  .brand { top: 14px; left: 14px; padding: 9px 13px 9px 10px; }
  .brand-txt h1 { font-size: 12px; }
  .brand-txt p { font-size: 9px; }
  .rev { display: none; }
  .hint { display: none; }

  .panel {
    top: auto; bottom: 0; left: 0; right: 0; width: 100%;
    max-height: 64vh; border-radius: 18px 18px 0 0;
    padding: 10px 18px 26px;
    border-bottom: none;
    animation: fadeUp .6s cubic-bezier(.2,.8,.2,1) both;
  }
  .panel.collapsed { transform: translateY(calc(100% - 46px)); }
  .panel-tab {
    display: flex; flex-direction: column; gap: 3px; align-items: center;
    position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    background: none; border: none; padding: 4px; cursor: pointer;
  }
  .panel-tab span {
    width: 26px; height: 1.5px; background: rgba(255,255,255,.3); border-radius: 2px;
  }
}

</style>
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>

  <div id="labels"></div>

  <header class="brand">
    <div class="brand-mark"></div>
    <div class="brand-txt">
      <h1>珠光 1 栋 · 3F</h1>
      <p>315 会议室 &nbsp;/&nbsp; 303 · 301 服装展示区</p>
    </div>
    <span class="rev">R02</span>
  </header>

  <aside class="panel" id="panel">
    <button class="panel-tab" id="panelToggle" aria-label="收起面板">
      <span></span><span></span><span></span>
    </button>

    <section>
      <h2>视角</h2>
      <div class="views">
        <button class="vbtn" data-view="aerial">鸟瞰</button>
        <button class="vbtn" data-view="hall">展厅</button>
        <button class="vbtn" data-view="meeting">会议</button>
        <button class="vbtn" data-view="entrance">入口</button>
        <button class="vbtn" data-view="top">俯视</button>
      </div>
    </section>

    <section>
      <h2>显示</h2>
      <div class="switches" id="switches">
        <label class="sw"><span>顶面</span><input type="checkbox" data-toggle="roof"><i></i></label>
        <label class="sw"><span>外墙</span><input type="checkbox" data-toggle="shell" checked><i></i></label>
        <label class="sw"><span>玻璃隔断</span><input type="checkbox" data-toggle="glass" checked><i></i></label>
        <label class="sw"><span>家具陈列</span><input type="checkbox" data-toggle="furniture" checked><i></i></label>
        <label class="sw"><span>房间标签</span><input type="checkbox" data-toggle="labels" checked><i></i></label>
      </div>
    </section>

    <section>
      <h2>门 <em id="doorHint">点击门扇可开合</em></h2>
      <div class="doors" id="doors"></div>
      <div class="door-actions">
        <button id="allOpen">全部开启</button>
        <button id="allClose">全部关闭</button>
      </div>
    </section>

    <section class="restore">
      <button id="restore">恢复全部隐藏构件</button>
    </section>
  </aside>

  <div class="hint" id="hint">
    <span>拖动旋转</span><span>滚轮缩放</span><span>点击门开合</span><span>点击墙面 / 玻璃隐藏</span>
  </div>

  <div class="toast" id="toast"></div>

  <div class="loader" id="loader">
    <div class="loader-inner">
      <div class="ring"></div>
      <p>正在构建三维场景</p>
    </div>
  </div>
</div>
